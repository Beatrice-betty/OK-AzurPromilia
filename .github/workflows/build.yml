name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'
  repository_dispatch:
    types:
      - auto-release

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "you@example.com"
          git config --global user.name "you"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            "tag=${{ github.event.client_payload.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s tests -p "Test*.py" -v

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            "tag=${{ github.event.client_payload.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master

      # 诊断用：PyAppify 把 pip 的 stdout/stderr 发到 Tauri 事件通道（src-tauri/src/utils/command.rs
      # 用的是 emit_info!/emit_error!），命令行模式下不落盘，所以打包失败时 GitHub 日志里
      # 只有一行 "Setup failed"，看不到 pip 的真实报错。这里在失败后复跑同一套命令把它打出来。
      #
      # ⚠️ 顺序很重要：pip 复跑必须放最前面。上次把文件 dump 放在前面，结果扫到了 python/Doc
      # 下面几千个文档 json，把真正有用的输出淹没了。
      - name: Diagnose PyAppify setup failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $app  = 'pyappify_dist/ok-ap'
          $data = "$app/data/apps/ok-ap"
          $py   = "$data/python/python.exe"
          $req  = "$data/working/requirements.txt"

          # pyappify 的 lib.rs 里 LoggerBuilder 配置为 .log_dir("logs") + .file_prefix("app")，
          # 且 CLI 模式（-c setup）下 .stdout(!has_cli_command(...)) == false，stdout 被主动关掉。
          # pip 的完整输出（emit_info!/emit_error! -> tracing）只落在这个日志文件里。
          Write-Host '===== 1. 找 pyappify 的日志文件（关键）====='
          $logs = @()
          foreach ($c in @('logs', 'pyappify_dist/logs', "$app/logs", "$app/data/logs")) {
            if (Test-Path $c) { $logs += Get-ChildItem $c -Filter '*.log' -File -ErrorAction SilentlyContinue }
          }
          if (-not $logs) {
            $logs = Get-ChildItem . -Recurse -Depth 3 -Directory -Filter 'logs' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ChildItem $_.FullName -Filter '*.log' -File -ErrorAction SilentlyContinue }
          }
          $logs = $logs | Sort-Object LastWriteTime -Descending | Select-Object -First 5
          if ($logs) {
            foreach ($l in $logs) { Write-Host "  $($l.FullName)  ($($l.Length) bytes)" }
          } else {
            Write-Host '  (没找到日志文件)'
          }

          Write-Host '===== 2. 最新日志末尾 250 行 ====='
          if ($logs) { Get-Content $logs[0].FullName -Tail 250 | Write-Host } else { Write-Host '  (跳过)' }

          Write-Host '===== 3. 路径检查 ====='
          Write-Host "python.exe       : $(Test-Path $py)"
          Write-Host "requirements.txt : $(Test-Path $req)"
          Write-Host "working 目录     : $(Test-Path "$data/working")"

          Write-Host '===== 4. 可能干扰的 Python/Pip 环境变量 ====='
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(PYTHON|PIP|VIRTUAL_ENV)' } |
            ForEach-Object { Write-Host "  $($_.Name)=$($_.Value)" }

          Write-Host '===== 5. python / pip 版本 ====='
          if (Test-Path $py) {
            & (Resolve-Path $py).Path --version
            Write-Host "  python --version 退出码=$LASTEXITCODE"
            & (Resolve-Path $py).Path -m pip --version
            Write-Host "  pip --version 退出码=$LASTEXITCODE"
          } else {
            Write-Host "  python.exe 不存在: $py"
          }

          Write-Host '===== 6. pyappify 自己的配置 ====='
          foreach ($f in @("$app/data/config/app_config.json", "$data/app.json")) {
            Write-Host "--- $f"
            if (Test-Path $f) { Get-Content $f -Raw | Write-Host } else { Write-Host '(不存在)' }
          }

          Write-Host '===== 7. 兜底：复跑 pip（带绝对路径）====='
          if ((Test-Path $py) -and (Test-Path $req)) {
            # ⚠️ 必须转绝对路径：Push-Location 之后相对路径会失效（上次就栽在这）
            $pyAbs   = (Resolve-Path $py).Path
            $reqAbs  = (Resolve-Path $req).Path
            $workAbs = (Resolve-Path "$data/working").Path
            Push-Location $workAbs
            Write-Host "  CWD = $(Get-Location)"
            & $pyAbs -m pip install --no-warn-script-location -r $reqAbs
            Write-Host "  >>> pip 退出码 = $LASTEXITCODE"
            Pop-Location
          } else {
            Write-Host '  跳过：python.exe 或 requirements.txt 不存在'
          }

      - name: Upload pyappify diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pyappify-diagnostics
          if-no-files-found: warn
          path: |
            logs/**
            pyappify_dist/logs/**
            pyappify_dist/ok-ap/logs/**
            pyappify_dist/ok-ap/data/apps/ok-ap/**
            !pyappify_dist/ok-ap/data/apps/ok-ap/python/**
            !pyappify_dist/ok-ap/data/apps/ok-ap/working/.git/**
            !**/*.pyc

      - name: Add version to build filenames
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}"
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$version$($_.Extension)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyappify_dist-${{ steps.tag.outputs.tag }}
          path: pyappify_dist/*

  release:
    needs: [build]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'repository_dispatch'
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            "tag=${{ github.event.client_payload.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyappify_dist-${{ steps.tag.outputs.tag }}
          path: pyappify_dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          body: |
            ### Download
            * setup installer for ${{ steps.tag.outputs.tag }}
          files: pyappify_dist/**